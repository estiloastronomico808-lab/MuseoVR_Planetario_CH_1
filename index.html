<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Museo Virtual Planetario Digital Chimalhuacán (Versión Prestamo)</title>

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#05060f">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Museo Solar">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    
    <style>
        #btn-instalar {
            display: none;
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            z-index: 10000;
            padding: 10px 16px;
            border: 0;
            border-radius: 999px;
            background: #ff8a1f;
            color: #1a0f00;
            font: 600 15px/1 system-ui, sans-serif;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .45);
        }

        #logo-ar {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            right: calc(12px + env(safe-area-inset-right, 0px));
            width: clamp(96px, 24vw, 170px);
            height: auto;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity .6s ease;
            /* Sombra para que el logo blanco se lea sobre cualquier fondo */
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .75))
                    drop-shadow(0 0 8px rgba(0, 0, 0, .45));
        }

        #logo-ar.visible {
            opacity: 1;
        }
    </style>


    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body>


   

    <a-scene
        mindar-image="imageTargetSrc: targets/TG_SOL3.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">



        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


       <a-entity
    mindar-image-target="targetIndex: 0">

   
    <a-gltf-model
        src="modelos/sun1.glb"
        position="0 0 0"
        scale="1 1 1">
    </a-gltf-model>


<a-text
    value="EL SOL"
    align="center"
    position="0 -0.6 0"
    color="#FFFFFF"
    width="2">
</a-text>


<a-plane
    position="0 -1.35 -0.05"
    width="3.0"
    height="1.35"
    color="#222222"
    opacity="0.9">
</a-plane>


<a-text
    value="Nuestra estrella"
    align="center"
    position="0 -0.85 0"
    color="#FFFFFF"
    width="2.4">
</a-text>


<a-text
    value="Diámetro: 1,392,000 km"
    align="center"
    position="0 -1.08 0"
    color="#FFFFFF"
    width="2.2">
</a-text>


<a-text
    value="Temperatura superficial: ~5,500 °C"
    align="center"
    position="0 -1.30 0"
    color="#FFFFFF"
    width="2.0">
</a-text>


<a-text
    value="~1.3 millones de Tierras"
    align="center"
    position="0 -1.52 0"
    color="#FFFFFF"
    width="2.2">
</a-text>


<a-text
    value="por volumen"
    align="center"
    position="0 -1.70 0"
    color="#CCCCCC"
    width="1.6">
</a-text>
</a-entity>


    </a-scene>

    <img id="logo-ar"
         src="img/logo-planetario.png"
         alt="Planetario Digital Chimalhuacán"
         width="640" height="435">

    <button id="btn-instalar" type="button">Instalar app</button>


    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function (err) {
                    console.error('No se pudo registrar el service worker:', err);
                });
            });
        }

      
        var logoAR = document.getElementById('logo-ar');
        document.querySelector('a-scene').addEventListener('arReady', function () {
            logoAR.classList.add('visible');
        });

        var eventoInstalacion = null;
        var btnInstalar = document.getElementById('btn-instalar');

        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            eventoInstalacion = e;
            btnInstalar.style.display = 'block';
        });

        btnInstalar.addEventListener('click', function () {
            if (!eventoInstalacion) return;
            eventoInstalacion.prompt();
            eventoInstalacion.userChoice.finally(function () {
                eventoInstalacion = null;
                btnInstalar.style.display = 'none';
            });
        });

        window.addEventListener('appinstalled', function () {
            btnInstalar.style.display = 'none';
        });
    </script>


</body>

</html>
